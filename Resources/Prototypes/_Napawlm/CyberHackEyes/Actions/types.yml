- type: entity
  id: ActionCyberEyeHackOverload
  name: Overload Machine
  description: Overload a powered machine within range, causing it to explode.
  categories: [ HideSpawnMenu ]
  components:
  - type: EntityTargetAction
    useDelay: 1
    checkCanAccess: false
    range: 0
    icon: { sprite: _Goobstation/Objects/Misc/sandevistan.rsi, state: icon }
    itemIconStyle: NoItem
    event: !type:CyberEyeHackOverloadEvent

- type: entity
  id: ActionCyberEyeHackOpenUi
  name: Open Machine Interface
  description: Open the interface of a nearby AI-whitelisted machine.
  categories: [ HideSpawnMenu ]
  components:
  - type: EntityTargetAction
    useDelay: 1
    checkCanAccess: false
    range: 0
    icon: { sprite: _Goobstation/Objects/Misc/sandevistan.rsi, state: icon }
    itemIconStyle: NoItem
    event: !type:CyberEyeHackOpenUiEvent
